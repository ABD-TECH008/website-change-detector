<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Detector</title>
<style>
:root{--bg:#f3f5f7;--ink:#17202a;--mute:#5d6b79;--line:#d5dbe1;--ok:#13795b;--err:#b42318;--blk:#a15c07;--acc:#1d4ed8}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 24px;border-bottom:1px solid var(--line);background:#fff}header a{font-size:22px;font-weight:700;color:var(--ink);text-decoration:none}
main{max-width:1100px;margin:0 auto;padding:24px}h2{margin:0 0 12px;font-size:18px}
section{background:#fff;border:1px solid var(--line);padding:18px;margin-bottom:20px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
input,select,textarea,button{font:inherit;padding:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}button{cursor:pointer;background:var(--ink);color:#fff;border-color:var(--ink)}
button.ghost{background:#fff;color:var(--ink)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wide{grid-column:1/-1}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.pill{padding:2px 10px;border:1px solid;font-size:13px}.ok{color:var(--ok)}.error{color:var(--err)}.blocked{color:var(--blk)}.pending{color:var(--mute)}
#pv{max-width:100%;border:1px solid var(--line);cursor:crosshair;display:block;margin-top:8px}
pre{margin:0;padding:12px;background:#fafbfc;border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto}
.add{background:#dcfce7}.rem{background:#fee2e2;text-decoration:line-through}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cols img,#dimg{max-width:100%;border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}small{color:var(--mute)}@media(max-width:700px){.cols{grid-template-columns:1fr}}
</style>
<header><a href="#/">Change Detector</a></header><main id="app"></main>
<script>
const app=document.getElementById('app'),api=(p,o)=>fetch('/api'+p,o).then(r=>r.json()),when=t=>t?new Date(t).toLocaleString():'never';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function home(){const ws=await api('/watches');
 app.innerHTML=`<section><h2>Watch a page</h2><form id="f">
 <label>Name<input name="name" required></label><label>URL<input name="url" type="url" required placeholder="https://example.com/pricing"></label>
 <label>Check every<select name="interval_min"><option value="15">15 minutes</option><option value="60" selected>1 hour</option><option value="360">6 hours</option><option value="1440">24 hours</option></select></label>
 <label>Sensitivity<select name="sensitivity"><option value="low">Low: big changes only</option><option value="medium" selected>Medium</option><option value="high">High: any text change</option></select></label>
 <label>Alert webhook<input name="notify" placeholder="Discord/Slack URL, or tg:CHAT_ID"></label><label>Alert email<input name="email" type="email"></label>
 <label class="wide">Regions to watch (CSS selectors, separate with ||)<textarea name="watch_sel" id="ws" rows="2" placeholder="Empty = whole page"></textarea></label>
 <label class="wide">Regions to ignore<textarea name="ignore_sel" id="is" rows="2"></textarea></label>
 <div class="wide"><div class="row"><button type="button" class="ghost" id="pb">Pick regions on the page</button><label style="flex-direction:row;align-items:center"><input type="radio" name="mode" value="ws" checked> Watch</label><label style="flex-direction:row;align-items:center"><input type="radio" name="mode" value="is"> Ignore</label></div>
 <img id="pv" hidden alt="Page preview. Click an area to select it."><small id="pm"></small></div>
 <div class="wide row"><button>Start watching</button><small id="err" class="error"></small></div></form></section>
 <section><h2>Dashboard</h2><div class="tw"><table><tr><th>Name</th><th>Status</th><th>Last checked</th><th>Last changed</th><th></th></tr>
 ${ws.map(w=>`<tr><td><b>${esc(w.name)}</b><br><small>${esc(w.url)}</small></td><td><span class="pill ${w.status}" title="${esc(w.error)}">${w.status==='ok'?'OK':w.status}</span></td><td>${when(w.last_checked)}</td><td>${when(w.last_changed)}</td>
 <td class="row"><a href="#/w/${w.id}">Timeline</a><button class="ghost" onclick="chk(${w.id})">Check now</button><button class="ghost" onclick="del(${w.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No pages yet. Add one above.</td></tr>'}</table></div></section>`;
 const f=document.getElementById('f'),pv=document.getElementById('pv');
 f.onsubmit=async e=>{e.preventDefault();const r=await api('/watches',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});r.error?err.textContent=r.error:home()};
 pb.onclick=()=>{if(!f.url.value)return pm.textContent='Enter a URL first.';pm.textContent='Loading preview…';pv.src='/api/preview?url='+encodeURIComponent(f.url.value);pv.onload=()=>{pv.hidden=false;pm.textContent='Click an element to add it.'}};
 pv.onclick=async e=>{const r=pv.getBoundingClientRect(),k=pv.naturalWidth/r.width,j=await api('/pick',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:f.url.value,x:(e.clientX-r.left)*k,y:(e.clientY-r.top)*k})});
  if(j.selector){const t=document.getElementById(f.mode.value);t.value+=(t.value?'||':'')+j.selector;pm.textContent='Added '+j.selector}};}
async function chk(id){await api(`/watches/${id}/check`,{method:'POST'});setTimeout(home,3000)}
async function del(id){if(confirm('Delete this watch and its history?')){await api('/watches/'+id,{method:'DELETE'});home()}}
async function timeline(id,a,b){const sn=await api(`/watches/${id}/snapshots`),opt=s=>sn.map(x=>`<option value="${x.id}" ${x.id==s?'selected':''}>#${x.id} · ${when(x.created_at)}</option>`).join('');
 a=a||sn[1]?.id||sn[0]?.id;b=b||sn[0]?.id;
 app.innerHTML=`<section><h2>Version timeline</h2><p><a href="#/">Back to dashboard</a> · <a href="/api/watches/${id}/rss">RSS feed</a></p>${sn.length?`<div class="row"><label>From<select id="a">${opt(a)}</select></label><label>To<select id="b">${opt(b)}</select></label><button id="go">Compare</button></div>`:'<p>No snapshots yet. The first check is in the queue.</p>'}</section><div id="cmp"></div>`;
 if(!sn.length)return;
 const go=async()=>{const A=a.value,B=b.value,d=await api(`/diff?a=${A}&b=${B}`);
  cmp.innerHTML=`<section><h2>Text changes</h2><pre>${d.map(p=>`<span class="${p.added?'add':p.removed?'rem':''}">${esc(p.value)}</span>`).join('')}</pre></section>
  <section><h2>Side by side</h2><div class="cols"><div><small>#${A}</small><img src="/api/shot/${A}" alt="Earlier version"></div><div><small>#${B}</small><img src="/api/shot/${B}" alt="Later version"></div></div></section>
  <section><h2>Screenshot differences</h2><img id="dimg" src="/api/imgdiff?a=${A}&b=${B}" alt="Changed pixels highlighted"></section>`};
 document.getElementById('go').onclick=go;go()}
const route=()=>{const m=location.hash.match(/^#\/w\/(\d+)(?:\/(\d+)\/(\d+))?/);m?timeline(m[1],m[2],m[3]):home()};addEventListener('hashchange',route);route();
</script></html>
